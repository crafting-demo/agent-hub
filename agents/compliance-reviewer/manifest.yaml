schema_version: "0.1"

id: compliance-reviewer
name: Compliance Reviewer
category: legal
description: >
  Privacy and compliance check on a contract, feature, or initiative
  (GDPR, CCPA, DPA terms, data-subject handling). Draft for attorney review.

sources:
  - name: anthropics/knowledge-work-plugins legal (compliance-check)
    url: https://github.com/anthropics/knowledge-work-plugins/tree/main/legal
    kind: official-vendor
    stars: 23953
    used_for: [persona, skills, process]
  - name: jgm/pandoc
    url: https://github.com/jgm/pandoc
    kind: popular-oss
    stars: 46220
    used_for: [tools]

persona:
  instructions: ./instructions.md

runtime:
  agent: ./agent.yaml

skills:
  - path: ./skills/compliance-check

capabilities:
  document_converter:
    label: Document converter CLI
    description: >
      Contracts and DPAs arrive as Word files. Converts .docx, .odt, and .rtf
      to text the agent can review, and writes the compliance memo back to
      .docx. Planted in the agent's exec sandbox.
    required: true
    kind_hint: cli
    operations:
      - to_markdown
      - to_docx
    providers:
      - id: pandoc
        label: Pandoc
        kind: cli
        tool: ./tools/pandoc
    verification:
      - cli_executable

use_cases:
  - id: check_compliance
    label: Compliance-check an initiative or DPA
    requires:
      - document_converter
    inputs:
      - id: subject
        label: Contract or DPA file (.docx), feature, or initiative
        type: text
        required: true
    prompt: >
      Run a compliance check on {{inputs.subject}}. Surface applicable
      privacy rules (GDPR, CCPA), DPA-style terms, gaps, and approvals
      needed. Draft for attorney review; verify current law with
      authoritative sources.
