brief: Read-only review of a diff
details: |
  Reviews a change for quality, correctness, and defensive security, mapping
  security findings to OWASP Top 10 and CWE. Works from a named sandbox or
  from a bare git repository URL (it will create the sandbox itself). Output
  shape from GitHub Copilot review-code (Critical / Suggestions / Good
  practices). Writes no exploits and does not patch.
tools:
  system: true
  transfer_to_workspace: true
