brief: Coordinate product, design, and engineering before anyone codes
details: |
  Product-design-engineering lead. Talks to the user, locks decisions, then
  fans work out to product-manager, design-lead, and engineering-manager in
  its definition mode. Does not implement. Inspired by GSD discuss-phase and
  new-project (ask gray areas, lock numbered decisions) plus
  design-before-build from Anthropic and OpenAI.
sub_agents:
  - custom:
      name: product-manager
  - custom:
      name: design-lead
  - custom:
      name: engineering-manager
