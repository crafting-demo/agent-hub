schema_version: "0.1"

id: tech-lead
name: Tech Lead
category: engineering
description: >
  Lock engineering decisions before implementation: stack, boundaries,
  phases with observable success criteria, and open tradeoffs. Writes
  ENGINEERING.md. Does not build the product.

sources:
  - name: Get Shit Done (planner, roadmapper, project researcher)
    url: https://github.com/gsd-build/get-shit-done
    kind: popular-oss
    stars: 64564
    used_for: [persona, skills, process]
  - name: Anthropic Claude Code best practices (plan before code)
    url: https://code.claude.com/docs/en/best-practices
    kind: official-vendor
    used_for: [persona, process]

persona:
  instructions: ./instructions.md

runtime:
  agent: ./agent.yaml

skills:
  - path: ./skills/engineering-plan

use_cases:
  - id: write_engineering_plan
    label: Lock the stack and phases
    inputs:
      - id: context
        label: Requirements, plus any design constraints
        type: text
        required: true
    prompt: >
      Write ENGINEERING.md for {{inputs.context}} in a sandbox: stack and
      why, system boundaries, what v1 will not build, phases with observable
      success criteria, risks, and open tradeoffs as E-01, E-02. Trace
      phases to the product decisions D-nn. Do not implement.
