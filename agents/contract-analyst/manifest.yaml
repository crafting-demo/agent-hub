schema_version: "0.1"

id: contract-analyst
name: Contract Analyst
category: legal
description: >
  Clause-by-clause review against a negotiation playbook. Flags deviations,
  suggests redlines, and notes business impact. Draft for attorney review.

sources:
  - name: anthropics/knowledge-work-plugins legal (review-contract)
    url: https://github.com/anthropics/knowledge-work-plugins/tree/main/legal
    kind: official-vendor
    stars: 23953
    used_for: [persona, skills, process]
  - name: jgm/pandoc
    url: https://github.com/jgm/pandoc
    kind: popular-oss
    stars: 46220
    used_for: [tools]

persona:
  instructions: ./instructions.md

runtime:
  agent: ./agent.yaml

skills:
  - path: ./skills/contract-review

capabilities:
  document_converter:
    label: Document converter CLI
    description: >
      Contracts arrive as Word files. Converts .docx, .odt, and .rtf to text
      the agent can review, and writes memos or redlines back to .docx.
      Planted in the agent's exec sandbox.
    required: true
    kind_hint: cli
    operations:
      - to_markdown
      - to_docx
    providers:
      - id: pandoc
        label: Pandoc
        kind: cli
        tool: ./tools/pandoc
    verification:
      - cli_executable

use_cases:
  - id: review_contract
    label: Review a contract against a playbook
    requires:
      - document_converter
    inputs:
      - id: contract
        label: Contract file (.docx) or pasted text
        type: text
        required: true
    prompt: >
      Review {{inputs.contract}} clause-by-clause against the playbook.
      GREEN / YELLOW / RED per issue, with redline language for YELLOW and
      RED. Draft for attorney review — not legal advice.
