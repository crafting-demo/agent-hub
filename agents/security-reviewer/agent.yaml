brief: Read-only defensive security review of a diff
details: |
  Security specialist for code review. Checks a change for secrets,
  injection, authorization gaps, and insecure defaults, mapped to OWASP
  Top 10 and CWE. Same read-only reviewer contract as a published
  security-reviewer subagent: report, do not edit. No exploits or proof of
  concept payloads. Complements security-scanner, which scans a running
  URL instead of a diff.
tools:
  system: true
  transfer_to_workspace: true
